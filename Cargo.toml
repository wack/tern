[workspace]
members = [".", "crates/tern-migration-wit", "crates/tern-migration-guest"]
resolver = "3"

[package]
name = "tern"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tern"
path = "src/bin/main.rs"

[dependencies]
# Workspace crates
tern-migration-wit = { path = "crates/tern-migration-wit" }
tern-migration-guest = { path = "crates/tern-migration-guest" }
async-trait = "0.1.89"
bon = "3.8.1"
jiff = { version = "0.2.1", features = ["serde"] }
blake3 = "1"
hex = "0.4"
serde_json = "1.0"
clap = { version = "4.5.53", features = ["derive", "env"] }
miette = { version = "7.6.0", features = ["fancy"] }
nutype = { version = "0.6.2", features = ["serde"] }
pretty_assertions = "1.4.1"
serde = { version = "1.0.228", features = ["derive"] }
static_assertions = "1.1.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = "0.23"
webpki-roots = "0.26"
tracing = { version = "0.1.43", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tokio-rustls = "0.26.4"

[dev-dependencies]
insta = { version = "1.42", features = ["yaml"] }
tempfile = "3.16"
