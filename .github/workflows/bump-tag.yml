# Workflow to prepare a new release by:
# 1. Using git-cliff to calculate the next semantic version
# 2. Updating version in Cargo.toml and Cargo.lock
# 3. Generating changelog with git-cliff
# 4. Committing changes and pushing to a version branch

name: Bump Tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git-cliff

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Calculate next version
        id: next-version
        run: |
          # Use git-cliff to automatically determine the next version
          # based on conventional commits and bump rules in cliff.toml
          NEW_VERSION=$(git cliff --bumped-version)

          if [ -z "$NEW_VERSION" ]; then
            echo "No version bump needed - no relevant commits since last tag"
            exit 1
          fi

          # Remove 'v' prefix if present for the version number
          VERSION_NUMBER="${NEW_VERSION#v}"

          echo "version=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Calculated next version: $VERSION_NUMBER"

      - name: Update Cargo.toml version
        run: |
          NEW_VERSION="${{ steps.next-version.outputs.version }}"

          # Update version in the main package section of Cargo.toml
          # This matches the first 'version = "..."' line after [package]
          sed -i "0,/^version = \".*\"/s//version = \"$NEW_VERSION\"/" Cargo.toml

          echo "Updated Cargo.toml to version $NEW_VERSION"
          grep -m1 '^version = ' Cargo.toml

      - name: Update Cargo.lock
        run: |
          # Update the lockfile to reflect the new version without updating dependencies
          cargo update --workspace
          echo "Updated Cargo.lock"

      - name: Generate changelog
        run: |
          NEW_TAG="${{ steps.next-version.outputs.tag }}"

          # Generate full changelog with the new version tag
          git cliff --tag "$NEW_TAG" --output CHANGELOG.md

          echo "=== Generated Changelog ==="
          head -100 CHANGELOG.md

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and checkout version branch
        run: |
          NEW_TAG="${{ steps.next-version.outputs.tag }}"
          git checkout -b "$NEW_TAG"
          echo "Created and checked out branch: $NEW_TAG"

      - name: Commit changes
        run: |
          NEW_VERSION="${{ steps.next-version.outputs.version }}"
          NEW_TAG="${{ steps.next-version.outputs.tag }}"

          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "Release $NEW_TAG

          - Update version to $NEW_VERSION
          - Generate changelog for $NEW_TAG"

          echo "Committed release changes"

      - name: Push branch to remote
        run: |
          NEW_TAG="${{ steps.next-version.outputs.tag }}"
          git push -u origin "$NEW_TAG"
          echo "Pushed branch $NEW_TAG to remote"

      - name: Summary
        run: |
          echo "## Release Preparation Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **New Version:** ${{ steps.next-version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ steps.next-version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The version branch has been pushed. Create a PR or push a tag to trigger the release workflow." >> "$GITHUB_STEP_SUMMARY"
