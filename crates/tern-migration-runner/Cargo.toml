[package]
name = "tern-migration-runner"
version = "0.1.0"
edition = "2024"
description = "WebAssembly runtime for executing Tern migration components"
license = "MIT"
repository = "https://github.com/wack/tern"

[[bin]]
name = "tern-migration-runner"
path = "src/main.rs"

[lib]
name = "tern_migration_runner"
path = "src/lib.rs"

[dependencies]
# WIT definitions from the sister crate
tern-migration-wit = { path = "../tern-migration-wit" }
tern-migration-guest = { path = "../tern-migration-guest" }

# WebAssembly runtime
wasmtime = { version = "41", features = ["component-model"] }

# CLI framework
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full", "sync"] }

# PostgreSQL client
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = "0.23"
webpki-roots = "0.26"

# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async trait support
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1.4"
