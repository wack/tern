[package]
name = "tern-migration-guest"
version = "0.1.0"
edition = "2024"
description = "WASI guest component that delegates migration execution to embedded data"
license = "MIT"

# Build as a WASI component library
[lib]
crate-type = ["cdylib", "rlib"]
name = "tern_migration_guest"
path = "src/lib.rs"

[dependencies]
# WIT definitions from the sister crate
tern-migration-wit = { path = "../tern-migration-wit" }

# wit-bindgen generates Rust bindings from WIT files for guest (component) code.
# The version should be compatible with the component model tooling being used.
wit-bindgen = "0.41"

[dev-dependencies]
pretty_assertions = "1.4"

[features]
# Default features for typical usage
default = []
