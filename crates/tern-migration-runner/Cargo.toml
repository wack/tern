[package]
name = "tern-migration-runner"
version = "0.1.0"
edition = "2024"
description = "WASI CLI application for executing Tern migration components"
license = "MIT"
repository = "https://github.com/wack/tern"
# Exclude from cargo-dist releases (test-only binary)
publish = false

# Build as a WASI component library
[lib]
crate-type = ["cdylib", "rlib"]
name = "tern_migration_runner"
path = "src/lib.rs"

# Binary is only for native testing, not for WASI target
[[bin]]
name = "tern-migration-runner"
path = "src/main.rs"
# Only build binary for non-WASI targets
required-features = ["native"]

[dependencies]
# WIT definitions
tern-migration-wit = { path = "../tern-migration-wit" }

# Component model bindings generator
# This generates Rust bindings from WIT files
wit-bindgen = "0.41"

# Serialization for JSON output
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Dependencies only for native builds (testing)
# The actual WASI runner doesn't need these
clap = { version = "4", features = ["derive", "env"], optional = true }
miette = { version = "7", features = ["fancy"], optional = true }
thiserror = { version = "2", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"

[features]
# Default features for WASI target (minimal)
default = []

# Native feature enables CLI binary for testing
native = ["dep:clap", "dep:miette", "dep:thiserror"]
