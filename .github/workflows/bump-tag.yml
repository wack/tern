# Workflow to prepare a new release by:
# 1. Generating changelog with git-cliff
# 2. Determining version bump type from changelog
# 3. Updating version in Cargo.toml and Cargo.lock
# 4. Committing changes and pushing to a version branch

name: Bump Tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git-cliff

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate initial changelog (with unreleased section)
        run: |
          git cliff --unreleased --output CHANGELOG_UNRELEASED.md
          echo "=== Unreleased Changelog ==="
          cat CHANGELOG_UNRELEASED.md

      - name: Determine version bump type
        id: bump-type
        run: |
          CHANGELOG=$(cat CHANGELOG_UNRELEASED.md)

          # Check for breaking changes (must be major bump)
          if echo "$CHANGELOG" | grep -qiE '### Breaking Changes|BREAKING'; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
            echo "Detected: BREAKING changes -> major version bump"
          # Check if ONLY bug fixes and/or security (patch bump)
          # We check if there are any changes, and if all changes are bug fixes or security
          elif echo "$CHANGELOG" | grep -qE '### (Bug Fixes|Security)'; then
            # Check if there are any other types of changes
            if echo "$CHANGELOG" | grep -qE '### (Features|Documentation|Refactoring|Performance|Testing|Build|Miscellaneous|Changes)'; then
              echo "bump=minor" >> "$GITHUB_OUTPUT"
              echo "Detected: Mixed changes including features -> minor version bump"
            else
              echo "bump=patch" >> "$GITHUB_OUTPUT"
              echo "Detected: Only BUG/SECURITY changes -> patch version bump"
            fi
          # Check if there are any changes at all
          elif echo "$CHANGELOG" | grep -qE '### '; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            echo "Detected: Other changes -> minor version bump"
          else
            echo "bump=none" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          fi

          # Clean up temporary file
          rm -f CHANGELOG_UNRELEASED.md

      - name: Check for changes
        if: steps.bump-type.outputs.bump == 'none'
        run: |
          echo "No changes detected since last release. Exiting."
          exit 1

      - name: Read current version from Cargo.toml
        id: current-version
        run: |
          # Extract version from the main package in Cargo.toml
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Calculate new version
        id: new-version
        run: |
          CURRENT="${{ steps.current-version.outputs.version }}"
          BUMP="${{ steps.bump-type.outputs.bump }}"

          # Parse major.minor.patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              NEW_MAJOR=$((MAJOR + 1))
              NEW_VERSION="${NEW_MAJOR}.0.0"
              ;;
            minor)
              NEW_MINOR=$((MINOR + 1))
              NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
              ;;
            patch)
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
              ;;
          esac

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Calculated new version: $NEW_VERSION (bump type: $BUMP)"

      - name: Update Cargo.toml version
        run: |
          NEW_VERSION="${{ steps.new-version.outputs.version }}"

          # Update version in the main package section of Cargo.toml
          # This matches the first 'version = "..."' line after [package]
          sed -i "0,/^version = \".*\"/s//version = \"$NEW_VERSION\"/" Cargo.toml

          echo "Updated Cargo.toml to version $NEW_VERSION"
          grep -m1 '^version = ' Cargo.toml

      - name: Update Cargo.lock
        run: |
          # Update the lockfile to reflect the new version without updating dependencies
          cargo update --workspace
          echo "Updated Cargo.lock"

      - name: Generate final changelog
        run: |
          NEW_TAG="${{ steps.new-version.outputs.tag }}"

          # Generate full changelog with the new version tag
          git cliff --tag "$NEW_TAG" --output CHANGELOG.md

          echo "=== Generated Changelog ==="
          head -100 CHANGELOG.md

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and checkout version branch
        run: |
          NEW_TAG="${{ steps.new-version.outputs.tag }}"
          git checkout -b "$NEW_TAG"
          echo "Created and checked out branch: $NEW_TAG"

      - name: Commit changes
        run: |
          NEW_VERSION="${{ steps.new-version.outputs.version }}"
          NEW_TAG="${{ steps.new-version.outputs.tag }}"

          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "Release $NEW_TAG

          - Update version to $NEW_VERSION
          - Generate changelog for $NEW_TAG"

          echo "Committed release changes"

      - name: Push branch to remote
        run: |
          NEW_TAG="${{ steps.new-version.outputs.tag }}"
          git push -u origin "$NEW_TAG"
          echo "Pushed branch $NEW_TAG to remote"

      - name: Summary
        run: |
          echo "## Release Preparation Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Previous Version:** ${{ steps.current-version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **New Version:** ${{ steps.new-version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Bump Type:** ${{ steps.bump-type.outputs.bump }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ steps.new-version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The version branch has been pushed. Create a PR or push a tag to trigger the release workflow." >> "$GITHUB_STEP_SUMMARY"
